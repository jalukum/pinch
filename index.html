    <title>Pinch — a little recipe box</title>
    <meta name="description" content="Paste any recipe link, get a beautiful recipe card, keep it forever." />
    <meta name="theme-color" content="#efe4d2" />
    <script>
      // Set the theme before first paint (no flash). Modes: auto | light | dark.
      ;(function () {
        var d = document.documentElement, mq = window.matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var m = 'auto'
          try { m = localStorage.getItem('pinch.theme') || 'auto' } catch (e) {}
          var t = m === 'auto' ? (mq.matches ? 'dark' : 'light') : m
          d.setAttribute('data-theme', t)
          d.setAttribute('data-theme-mode', m)
          var meta = document.querySelector('meta[name=theme-color]')
          if (meta) meta.setAttribute('content', t === 'dark' ? '#1d1612' : '#efe4d2')
        }
        window.__pinchTheme = apply
        apply()
        mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply)
      })()
    </script>
